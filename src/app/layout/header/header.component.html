<header class="bg-white shadow-sm">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between">
      <h1 class="text-xl font-semibold text-gray-900">Golden Raspberry Awards</h1>
      <nav class="flex gap-4">
        <a
          *ngFor="let item of navItems; trackBy: trackByRoute"
          [routerLink]="item.route"
          routerLinkActive="text-indigo-600 border-b-2 border-indigo-600"
          class="px-3 py-2 text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors"
        >
          {{ item.label }}
        </a>
      </nav>
    </div>
  </div>
</header>
