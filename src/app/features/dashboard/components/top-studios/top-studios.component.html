<p-card header="Top 3 studios with winners">
  <p-table [value]="studios" [tableStyle]="{ 'min-width': '100%' }">
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Win Count</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td>{{ item.name }}</td>
        <td>{{ item.winCount }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="2">No data available</td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
