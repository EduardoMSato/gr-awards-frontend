<p-card header="List years with multiple winners">
  <p-table [value]="years" [tableStyle]="{ 'min-width': '100%' }">
    <ng-template pTemplate="header">
      <tr>
        <th>Year</th>
        <th>Win Count</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td>{{ item.year }}</td>
        <td>{{ item.winnerCount }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="2">No data available</td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
